name: ConsoleDiscord
main: dev.boondocksulfur.consolediscord.ConsoleDiscordPlugin
version: 1.5.0
api-version: '1.21'
folia-supported: true
authors: [ "BoondockSulfur" ]
load: POSTWORLD
description: Advanced Discord integration with log forwarding, remote commands, performance monitoring, and Folia support

commands:
  cdr:
    description: Management commands for ConsoleDiscord
    usage: "/cdr reload | /cdr debug [on|off|status] | /cdr status | /cdr cleanup"
    aliases: ["consolediscord"]

permissions:
  consolediscord.reload:
    description: Allows reloading the plugin
    default: op
  consolediscord.debug:
    description: Allows toggling debug logging
    default: op
  consolediscord.status:
    description: Allows viewing the plugin status
    default: op
  consolediscord.cleanup:
    description: Allows triggering a manual message cleanup
    default: op
